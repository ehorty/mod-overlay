# Вариант без Docker: Node.js слушает 127.0.0.1:3000, nginx проксирует HTTPS.
# Подставьте свой домен и пути к сертификатам. Блок map кладётся в http {}.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name overlay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name overlay.example.com;

    ssl_certificate     /etc/letsencrypt/live/overlay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overlay.example.com/privkey.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для панели и оверлея
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
